[package]
name = "mikuamp"
version = "0.1.0"
description = "A little player with a big voice."
authors = ["MikuAmp"]
edition = "2021"

[lib]
name = "mikuamp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = { version = "0.21.1", default-features = false, features = ["playback", "symphonia-all"] }
lofty = "0.22"
rustfft = "6"
walkdir = "2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rand = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Graphics_Gdi"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
opt-level = 3
